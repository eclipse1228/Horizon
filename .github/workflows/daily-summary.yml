name: Daily Horizon Summary

on:
  # NOTE: This repository is a fork, so GitHub never triggers `schedule`
  # cron events for it. Automated runs are dispatched 4x/day (00/06/12/18 UTC
  # = 09/15/21/03 KST) by the Cloudflare Worker in cloudflare/horizon-cron.
  schedule:
    - cron: '0 9 * * *'  # Fallback only (active when repo is not a fork)
      timezone: 'Asia/Seoul'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          # AI: OpenRouter -> DeepSeek v4 Flash (see data/config.github.json)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          HORIZON_WEBHOOK_URL_2: ${{ secrets.HORIZON_WEBHOOK_URL_2 }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 4x/day dispatch (every 6h); 8h window covers the gap with margin
        run: uv run horizon --hours 8

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
